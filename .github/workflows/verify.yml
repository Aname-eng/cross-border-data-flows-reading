name: Verify research workspace

on:
  pull_request:
  push:
    branches:
      - main
      - literature-lineage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: Site, evidence, and deck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.10.2"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic acceptance chain
        run: python scripts/verify_workspace.py --check-generated-clean

  lean:
    name: Lean finite-optimum theorem
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Lake cache
        uses: actions/cache@v4
        with:
          path: |
            verification/lean/.lake/packages
            verification/lean/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile Lean project
        working-directory: verification/lean
        run: lake build
